<script>
/* ---------- state ---------- */
const KEY = "esfam-v2";
const blank = {done:{}, streak:0, last:"", srs:{}};
let S = blank;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) S = Object.assign({}, blank, JSON.parse(raw));
  else {
    const old = localStorage.getItem("esfam-v1");   // carry over the first version
    if (old) {
      const o = JSON.parse(old);
      S = {done:o.done||{}, streak:o.streak||0, last:o.last||"", srs:{}};
      (o.misses||[]).forEach(m => S.srs[m.k] = {
        kind:"ask", box:1, due:todayStr(),
        prompt:m.prompt, model:m.model, accepts:m.accepts||[], why:m.why, day:m.day
      });
    }
  }
} catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function todayStr(){ return new Date().toISOString().slice(0,10); }
const today = todayStr;
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function plusDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

/* ---------- the phone's Spanish voice ---------- */
let VOICE = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  // prefer Latin American Spanish, fall back to any Spanish at all
  VOICE = all.find(v => /es[-_](MX|US|419|CO|AR|CL|PE)/i.test(v.lang)) || all[0] || null;
}
if ("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged", () => { pickVoice(); if (view === "hoy") render(); });
}
function say(text, rate){
  if (!VOICE) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = VOICE; u.lang = VOICE.lang; u.rate = rate ? Number(rate) : 0.92;
  speechSynthesis.speak(u);
}
const SPK = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
function spk(text, rate, label){
  if (!VOICE) return "";
  return `<button class="spk" data-say="${esc(text)}" data-rate="${rate||0.92}" aria-label="${label||"Escuchar"}">${SPK}</button>`;
}

/* ---------- text matching ---------- */
function norm(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[¿?¡!.,;:"'()«»—-]/g," ")
    .replace(/\s+/g," ").trim();
}
function grade(input, model, accepts){
  const n = norm(input);
  if (!n) return "miss";
  const targets = [model].concat(accepts||[]).map(norm);
  if (targets.includes(n)) return "ok";
  const got = n.split(" ");
  const gotSet = new Set(got);
  let best = 0;
  for (const t of targets){
    const want = t.split(" ");
    const hits = want.filter(w => gotSet.has(w)).length;
    // min of recall and precision: missing words and padding both cost you
    best = Math.max(best, Math.min(hits / want.length, hits / got.length));
  }
  if (best >= 0.75) return "ok";
  if (best >= 0.45) return "close";
  return "miss";
}

/* ---------- spacing (Leitner boxes) ---------- */
const STEPS = [1, 2, 4, 8, 16];          // days until it comes back, by box
function srsMiss(payload){
  const k = payload.kind === "pair" ? "pair:" + payload.pairId : "ask:" + norm(payload.model);
  const cur = S.srs[k];
  S.srs[k] = Object.assign({}, payload, {box:1, due: plusDays(STEPS[0]), wrong: (cur ? cur.wrong||0 : 0) + 1});
  save();
}
function srsHit(payload){
  const k = payload.kind === "pair" ? "pair:" + payload.pairId : "ask:" + norm(payload.model);
  const cur = S.srs[k];
  if (!cur) return;
  const box = Math.min(cur.box + 1, STEPS.length);
  if (box >= STEPS.length && cur.box >= STEPS.length) { delete S.srs[k]; save(); return; }
  cur.box = box; cur.due = plusDays(STEPS[box - 1]);
  save();
}
function srsClear(payload){
  const k = payload.kind === "pair" ? "pair:" + payload.pairId : "ask:" + norm(payload.model);
  if (S.srs[k]) { delete S.srs[k]; save(); }
}
function dueItems(n){
  const t = today();
  return Object.values(S.srs)
    .filter(i => i.due <= t)
    .sort((a,b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.box - b.box))
    .slice(0, n || 3);
}

/* ---------- progress ---------- */
const nextDay = () => { for (const l of CURRICULUM) if (!S.done[l.day]) return l.day; return null; };
function complete(day){
  const t = today();
  if (!S.done[day]) S.done[day] = t;
  if (S.last !== t){
    S.streak = (S.last && daysBetween(S.last, t) === 1) ? S.streak + 1 : 1;
    S.last = t;
  }
  save();
}

/* ---------- render helpers ---------- */
const app = document.getElementById("app");
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let view = "hoy";

function scene(text){
  return text.split("\n").map(line => {
    const html = esc(line).replace(/\[([^\]|]+)\|([^\]]+)\]/g,
      (m, w, g) => `<button class="gl" data-gloss="${g}">${w}</button>`);
    return `<p>${html}</p>`;
  }).join("");
}

function paintStreak(){
  const el = document.getElementById("streak");
  const n = Object.keys(S.done).length;
  el.innerHTML = S.streak ? `<b>${S.streak}</b> día${S.streak===1?"":"s"} seguidos · ${n}/14` : `${n}/14 lecciones`;
}
function setView(v){
  view = v;
  for (const [id,name] of [["t-hoy","hoy"],["t-pal","palabras"],["t-err","memoria"]])
    document.getElementById(id).setAttribute("aria-selected", String(name === v));
  render();
}
document.getElementById("t-hoy").onclick = () => setView("hoy");
document.getElementById("t-pal").onclick = () => setView("palabras");
document.getElementById("t-err").onclick = () => setView("memoria");
document.getElementById("t-err").textContent = "Memoria";

// one listener for every speaker button and every glossed word
app.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if (s) { say(s.dataset.say, s.dataset.rate); return; }
  const g = e.target.closest(".gl");
  if (g) g.classList.toggle("on");
});

/* ---------- home ---------- */
function renderHome(){
  const d = nextDay();
  const due = dueItems(3).length;
  const dots = CURRICULUM.map(l => {
    const cls = S.done[l.day] ? "dot done" : (l.day === d ? "dot now" : "dot");
    return `<button class="${cls}" data-goto="${l.day}" title="Día ${l.day}: ${esc(l.title)}">${l.day}</button>`;
  }).join("");
  const novoz = VOICE ? "" : `<p class="muted small" style="margin:0">Sin voz en español todavía. En el iPhone: Ajustes › Accesibilidad › Contenido hablado › Voces › Español. Descarga una y vuelve.</p>`;

  if (d === null){
    app.innerHTML = `
      <div class="today">
        <div class="card stack">
          <div class="eyebrow">Terminaste el curso</div>
          <h2 style="font-size:31px">Los catorce días, hechos.</h2>
          <p class="muted" style="margin:0">Ahora esto es tu gimnasio. Repite cualquier día, o deja que la memoria te traiga lo que toca.</p>
          ${due ? `<div class="btn-row"><button class="btn" id="go-rev">Repasar ${due}</button></div>` : ``}
          ${novoz}
        </div>
        <div><div class="eyebrow" style="margin-bottom:12px">Repetir un día</div><div class="dots">${dots}</div></div>
      </div>`;
    if (due) document.getElementById("go-rev").onclick = () => startLesson(null);
  } else {
    const l = CURRICULUM.find(x => x.day === d);
    app.innerHTML = `
      <div class="today">
        <div class="card stack">
          <div class="daynum">Día ${l.day} de 14</div>
          <h2 style="font-size:31px">${esc(l.title)}</h2>
          <p class="muted" style="margin:0">Primero lo escuchas y lo entiendes. Después lo dices tú.</p>
          <div style="font-size:15px">
            ${due ? `<span class="pill">Repaso · ${due}</span> ` : ``}<span class="pill">Una escena</span>
            <span class="pill">5 palabras</span> <span class="pill">Oído</span> <span class="pill">5 respuestas</span>
          </div>
          <div class="btn-row"><button class="btn" id="go">Empezar</button></div>
          ${novoz}
        </div>
        <div><div class="eyebrow" style="margin-bottom:12px">El camino</div><div class="dots">${dots}</div></div>
      </div>`;
    document.getElementById("go").onclick = () => startLesson(l.day);
  }
  app.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => startLesson(Number(b.dataset.goto)));
}

/* ---------- lesson ---------- */
let L = null;
const STAGES = ["Repaso", "La escena", "Palabras", "El oído", "Conversación", "Por qué funciona"];

function buildQueue(day){
  const q = [];
  dueItems(3).forEach(i => q.push(Object.assign({}, i, {stage:0, isReview:true})));
  if (day !== null){
    const l = CURRICULUM.find(x => x.day === day);
    const p = PALTECA[day];
    q.push({stage:1, kind:"scene", input:p.input});
    q.push({stage:2, kind:"vocab", vocab:l.vocab, hooks:p.hooks});
    p.pairs.forEach(id => q.push({stage:3, kind:"pair", pairId:id, day}));
    l.convo.forEach(t => q.push({
      stage:4, kind:"ask", who:t.who, line:t.line, lineEn:t.lineEn,
      prompt:t.task, model:t.model, accepts:t.accepts, why:t.why, day
    }));
    q.push({stage:5, kind:"note", grammar:l.grammar});
    l.grammar.drills.forEach(dr => q.push({
      stage:5, kind:"ask", prompt:dr.q, model:dr.a, accepts:dr.alt, why:dr.why, day
    }));
  }
  q.push({stage:5, kind:"done"});
  return q;
}

function startLesson(day){
  L = {day, q:buildQueue(day), i:0, right:0, total:0};
  view = "leccion";
  for (const id of ["t-hoy","t-pal","t-err"]) document.getElementById(id).setAttribute("aria-selected","false");
  render();
}
function bar(stage){
  return `<div class="steps">${STAGES.map((_,i) => `<div class="step ${i<=stage?"on":""}"></div>`).join("")}</div>`;
}
function label(step){
  const name = step.isReview ? "Repaso" : STAGES[step.stage];
  return `<div class="stagelabel"><span class="n">${String(step.stage+1).padStart(2,"0")}</span><h2 style="font-size:25px">${esc(name)}</h2></div>`;
}
function advance(){
  L.i++;
  if (L.q[L.i].kind === "done" && L.day) complete(L.day);
  paintStreak();
  render();
}
function nextBtn(text){
  return `<div class="btn-row" style="margin-top:24px"><button class="btn" id="nx">${text||"Seguir"}</button></div>`;
}

function renderLesson(){
  const step = L.q[L.i];

  if (step.kind === "done"){
    const pct = L.total ? Math.round(100 * L.right / L.total) : 100;
    const nd = L.day ? CURRICULUM.find(x => x.day === L.day + 1) : null;
    app.innerHTML = `
      ${bar(5)}
      <div class="card stack">
        <div class="eyebrow">Terminado</div>
        <h2 style="font-size:31px">${L.right} de ${L.total}</h2>
        <p class="muted" style="margin:0">${pct >= 80 ? "Sólido. Eso ya te lo sabes." : pct >= 50 ? "Ahí vas. Lo que fallaste vuelve mañana, y otra vez en dos días." : "Día duro. Eso es lo que significa que sirvió — vuelve mañana."}</p>
        ${nd ? `<div style="border-top:1px solid var(--edge);padding-top:16px"><div class="eyebrow" style="margin-bottom:6px">La próxima vez</div><div style="font-family:var(--serif);font-size:20px">${esc(nd.title)}</div><div class="muted small">${esc(nd.focus)}</div></div>` : ``}
        <div class="btn-row"><button class="btn" id="fin">Listo</button></div>
      </div>`;
    document.getElementById("fin").onclick = () => setView("hoy");
    return;
  }

  if (step.kind === "scene"){
    app.innerHTML = `
      ${bar(step.stage)}
      ${label(step)}
      <div class="card">
        <div class="scene-h">
          <div style="font-family:var(--serif);font-size:20px">${esc(step.input.title)}</div>
          ${spk(step.input.text.replace(/\[([^\]|]+)\|[^\]]+\]/g,"$1"), 0.85, "Escuchar la escena")}
        </div>
        <div class="scene">${scene(step.input.text)}</div>
        <p class="muted small" style="margin:16px 0 0">Toca cualquier palabra subrayada para ver qué significa. Aquí no se califica nada — solo entiéndela.</p>
      </div>
      ${nextBtn("Ya la entendí")}`;
    document.getElementById("nx").onclick = advance;
    return;
  }

  if (step.kind === "vocab"){
    app.innerHTML = `
      ${bar(step.stage)}
      ${label(step)}
      <div class="card stack">
        ${step.vocab.map((v,i) => `
          <div class="word">
            <div class="es">${esc(v.es)} ${spk(v.es, 0.9)}</div>
            <div class="en">${esc(v.en)}</div>
            <div class="ex">${esc(v.ex)} ${spk(v.ex, 0.9)}<i>${esc(v.exEn)}</i></div>
            <div class="hook">${esc(step.hooks[i])}</div>
          </div>`).join("")}
      </div>
      ${nextBtn()}`;
    document.getElementById("nx").onclick = advance;
    return;
  }

  if (step.kind === "note"){
    app.innerHTML = `
      ${bar(step.stage)}
      ${label(step)}
      <div class="card">
        <div style="font-family:var(--serif);font-size:20px;margin-bottom:12px">${esc(step.grammar.title)}</div>
        <div class="note">${step.grammar.note}</div>
      </div>
      ${nextBtn("Ahora pruébalo")}`;
    document.getElementById("nx").onclick = advance;
    return;
  }

  if (step.kind === "pair"){
    const p = PAIRS[step.pairId];
    const which = Math.random() < 0.5 ? "a" : "b";
    app.innerHTML = `
      ${bar(step.stage)}
      ${label(step)}
      ${VOICE ? `
      <div class="card stack">
        <p class="muted small" style="margin:0">Una de estas dos. ¿Cuál oíste?</p>
        <div class="btn-row"><button class="btn" data-say="${esc(p[which])}" data-rate="0.8">${SPK} Escuchar</button></div>
        <div class="pair-opts">
          <button class="btn btn-quiet" data-pick="a">${esc(p.a)}</button>
          <button class="btn btn-quiet" data-pick="b">${esc(p.b)}</button>
        </div>
      </div>
      <div id="out"></div>`
      : `<div class="card"><p class="muted" style="margin:0">Esta parte necesita una voz en español en el teléfono. Ajustes › Accesibilidad › Contenido hablado › Voces › Español.</p></div>${nextBtn()}`}`;

    if (!VOICE){ document.getElementById("nx").onclick = advance; return; }
    say(p[which], 0.8);
    app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
      const ok = b.dataset.pick === which;
      L.total++;
      if (ok){ L.right++; srsHit(step); } else srsMiss(step);
      app.querySelectorAll("[data-pick]").forEach(x => x.disabled = true);
      document.getElementById("out").innerHTML = `
        <div class="verdict ${ok ? "ok" : "miss"}" style="margin-top:24px">
          <span class="tag ${ok ? "ok" : "miss"}">${ok ? "Eso era" : "Era la otra"}</span>
          <div class="model">${esc(p[which])}</div>
          <div class="why">${esc(p.note)}</div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-quiet" data-say="${esc(p.a)}" data-rate="0.75">${SPK} ${esc(p.a)}</button>
            <button class="btn btn-quiet" data-say="${esc(p.b)}" data-rate="0.75">${SPK} ${esc(p.b)}</button>
          </div>
        </div>
        ${nextBtn()}`;
      document.getElementById("nx").onclick = advance;
    });
    return;
  }

  // kind === "ask"
  app.innerHTML = `
    ${bar(step.stage)}
    ${label(step)}
    <div class="turn">
      ${step.line ? `<div class="said" id="said">
          <div class="who">${esc(step.who)} ${spk(step.line, 0.9)}</div>
          <div class="es">${esc(step.line)}</div>
          <div class="en">${esc(step.lineEn)}</div>
        </div>
        <button class="linkish" id="tr" style="align-self:flex-start">¿Qué dijo?</button>` : ``}
      <div class="task">${esc(step.prompt)}</div>
      <textarea id="ans" rows="2" placeholder="Escríbelo en español…" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
      <div class="btn-row"><button class="btn" id="chk">Revisar</button><button class="btn btn-quiet" id="skip">No sé</button></div>
    </div>
    <div id="out" style="margin-top:24px"></div>`;

  const ta = document.getElementById("ans");
  ta.focus();
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); check(); } });
  document.getElementById("chk").onclick = () => check();
  document.getElementById("skip").onclick = () => check(true);
  const tr = document.getElementById("tr");
  if (tr) tr.onclick = () => { document.getElementById("said").classList.add("show"); tr.remove(); };

  function check(skipped){
    const r = skipped ? "miss" : grade(ta.value, step.model, step.accepts);
    L.total++;
    const payload = {kind:"ask", prompt:step.prompt, model:step.model, accepts:step.accepts, why:step.why, day:step.day};
    if (r === "ok"){ L.right++; srsHit(payload); } else srsMiss(payload);

    const tag = r === "ok" ? `<span class="tag ok">Correcto</span>`
              : r === "close" ? `<span class="tag close">Casi</span>`
              : `<span class="tag miss">Todavía no</span>`;
    document.getElementById("out").innerHTML = `
      <div class="verdict ${r}">
        ${tag}
        <div class="model">${esc(step.model)} ${spk(step.model, 0.9)}</div>
        <div class="why">${esc(step.why)}</div>
        ${r !== "ok" ? `<button class="linkish" id="mine">Lo que escribí también sirve</button>` : ``}
      </div>
      ${nextBtn()}`;
    document.getElementById("chk").disabled = true;
    document.getElementById("skip").disabled = true;
    ta.disabled = true;
    const mine = document.getElementById("mine");
    if (mine) mine.onclick = () => { srsClear(payload); L.right++; mine.textContent = "Anotado."; mine.disabled = true; };
    document.getElementById("nx").onclick = advance;
    document.getElementById("nx").focus();
  }
}

/* ---------- palabras ---------- */
function renderPalabras(){
  const days = CURRICULUM.filter(l => S.done[l.day]);
  if (!days.length && !FROM_CHAT.length){
    app.innerHTML = `<div class="empty">Todavía no hay nada aquí.<br>Termina el día 1 y tus palabras empiezan a acumularse.</div>`;
    return;
  }
  const card = (v, hook) => `
    <div class="word">
      <div class="es">${esc(v.es)} ${spk(v.es, 0.9)}</div>
      <div class="en">${esc(v.en)}</div>
      <div class="ex">${esc(v.ex)}<i>${esc(v.exEn)}</i></div>
      ${hook ? `<div class="hook">${esc(hook)}</div>` : ``}
    </div>`;
  app.innerHTML = `
    <div class="stack-lg">
      ${FROM_CHAT.length ? `<div>
        <div class="sec-h"><div class="eyebrow">De nuestras clases en el chat</div></div>
        <div class="card">${FROM_CHAT.map(v => card(v)).join("")}</div>
      </div>` : ``}
      ${days.slice().reverse().map(l => `
        <div>
          <div class="sec-h"><div class="eyebrow">Día ${l.day} · ${esc(l.title)}</div></div>
          <div class="card">${l.vocab.map((v,i) => card(v, PALTECA[l.day].hooks[i])).join("")}</div>
        </div>`).join("")}
    </div>`;
}

/* ---------- memoria ---------- */
function renderMemoria(){
  const items = Object.values(S.srs);
  if (!items.length){
    app.innerHTML = `<div class="empty">Nada guardado todavía.<br>Lo que falles se queda aquí y vuelve mañana, después en dos días, cuatro, ocho, dieciséis.</div>`;
    return;
  }
  const t = today();
  const sorted = items.slice().sort((a,b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.box - b.box));
  const due = sorted.filter(i => i.due <= t).length;
  const row = i => {
    const title = i.kind === "pair" ? `${PAIRS[i.pairId].a} / ${PAIRS[i.pairId].b}` : i.model;
    const sub = i.kind === "pair" ? "Distinguir de oído" : i.prompt;
    const when = i.due <= t ? "hoy" : `en ${daysBetween(t, i.due)} d`;
    return `
      <div class="row">
        <div class="l">
          <div class="es">${esc(title)}</div>
          <div class="en">${esc(sub)}</div>
        </div>
        <div class="r">${"●".repeat(i.box)}${"○".repeat(STEPS.length - i.box)}<br>${when}</div>
      </div>`;
  };
  app.innerHTML = `
    <div class="stack">
      <p class="muted small" style="margin:0 0 8px">${due ? `${due} para hoy. ` : ``}Cada acierto lo empuja más lejos: mañana, dos días, cuatro, ocho, dieciséis. Cinco puntos llenos y sale de la lista.</p>
      <div class="card">${sorted.map(row).join("")}</div>
    </div>`;
}

/* ---------- go ---------- */
function render(){
  paintStreak();
  if (view === "leccion") renderLesson();
  else if (view === "palabras") renderPalabras();
  else if (view === "memoria") renderMemoria();
  else renderHome();
  window.scrollTo(0,0);
}
render();

</script>
